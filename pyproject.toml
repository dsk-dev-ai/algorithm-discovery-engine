[project]
name = "algorithm-discovery-engine"
version = "0.2.0"
description = "Multi-language algorithms & data structures solving engine (Java, C++, Rust, Python) plus automated mathematical pattern discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsk-dev-ai" }]
keywords = ["algorithms", "data-structures", "java", "cpp", "rust", "python", "learning", "benchmark", "algorithm-discovery", "sequence-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
    "Programming Language :: C++",
    "Programming Language :: Rust",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_discovery", "src/ads"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false