[project]
name = "algorithm-discovery-engine"
version = "1.0.0"
description = "Multi-language algorithms & data structures solving engine (Java, C++, Rust, Python) with cross-language benchmarks and a local AI synthesizer that rediscovers algorithms from examples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsk-dev-ai" }]
keywords = [
    "algorithms",
    "data-structures",
    "algorithm-discovery",
    "automated-discovery",
    "ai",
    "machine-learning",
    "java",
    "cpp",
    "rust",
    "python",
    "learning",
    "education",
    "benchmark",
    "synthesizer",
    "developer-tools",
    "open-source",
    "scientific-computing",
    "sequence-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
    "Programming Language :: C++",
    "Programming Language :: Rust",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
ade-gui = "gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_discovery", "src/ads", "src/synth", "src/gui"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false