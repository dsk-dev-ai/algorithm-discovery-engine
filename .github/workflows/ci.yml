name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy -p algo_discovery -p ads -p synth

  python-test:
    name: Pytest (3.10, 3.12, 3.13)
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync deps
        run: uv sync --group dev
      - name: Test
        run: uv run pytest -q

  vectors:
    name: Generated vectors in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated test vectors
        run: python engine/gen_tests.py --check

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run catalog tests
        working-directory: languages/java
        run: |
          javac -d out $(find src -name '*.java')
          java -cp out ads.TestRunner

  cpp:
    name: C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run catalog tests
        working-directory: languages/cpp
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -I include tests/test_runner.cpp -o build/test_runner
          ./build/test_runner

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run catalog tests
        working-directory: languages/rust
        run: cargo test --quiet

  discovery:
    name: Discovery smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --group dev
      - name: Run synth discover --smoke
        run: uv run python engine/runner.py discover
